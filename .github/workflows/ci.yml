name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Linux CUDA job is blocking again. It was best-effort for months and
    # silently rotted; now that it builds, a regression should fail the PR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Metal)
            os: macos-latest
            features: metal
            deps: ""
          - name: Linux (CPU)
            os: ubuntu-latest
            features: ""
            deps: libasound2-dev
          - name: Linux (CUDA)
            os: ubuntu-latest
            features: cuda
            deps: libasound2-dev
            cuda: true
          - name: Windows (CPU)
            os: windows-latest
            features: ""
            deps: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: matrix.deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      # Install only the components candle-kernels needs (nvcc + the libs cudarc
      # links). The full toolkit pulls cuda-demo-suite / cuda-runtime, whose
      # dpkg post-install scripts fail on the GitHub runner and take the whole
      # job down before a single line of Rust is compiled.
      - name: Install CUDA toolkit
        if: matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.6.3'
          method: network
          # Only the components candle-kernels/cudarc actually link. The full
          # toolkit pulls cuda-demo-suite / cuda-runtime, whose dpkg
          # post-install fails on the runner. The linker needs the -dev
          # variants for the .so symlinks, and cublas/curand carry no cuda-
          # prefix, so they live in non-cuda-sub-packages.
          sub-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]'

      # nvcc drives the host compiler, and on Windows that is cl.exe, which the
      # runner does not place on PATH. Without this, candle-kernels fails with
      # "nvcc fatal : Cannot find compiler 'cl.exe' in PATH".
      # esaxx-rs forces /MT via .static_crt(true) but ort-sys prebuilt links
      # against /MD. Force /MD on Windows so cc's last flag wins and the
      # CRT matches ort-sys. Without this, link fails with LNK2038.
      - name: Set Windows MSVC runtime flags
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CFLAGS=/MD" >> $env:GITHUB_ENV
          echo "CXXFLAGS=/MD" >> $env:GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The compute capability is part of the key: the kernel build keeps
          # its compiled .ptx files when only CUDA_COMPUTE_CAP changes, so a
          # cache from another capability would pass without compiling
          # anything for this one. Keep "cc80" equal to CUDA_COMPUTE_CAP below.
          key: ${{ runner.os }}-${{ matrix.features }}${{ matrix.cuda == true && '-cc80' || '' }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
        # 8.0 (RTX 30 series) is the oldest generation the candle kernels
        # compile for: 7.0 fails on bfloat16 tensor-core fragments, 6.1 on
        # atomicAdd for half floats. A binary built for 8.0 runs on newer
        # cards (checked on an RTX 4070 Ti SUPER, 8.9); the previous value, 89,
        # shut out everything older than the RTX 40 series.
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '80' || '' }}

      # Nobody on the project builds on Windows: the binary of a pull request
      # is the only way to try a change on a real Windows machine before it
      # is released. Kept three days.
      - name: Keep the Windows binary
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vox-windows-pr
          path: target/debug/vox.exe
          retention-days: 3

      # The CUDA jobs verify that the GPU feature still compiles. They cannot
      # run the result: libcuda.so.1 ships with the NVIDIA driver, not the
      # toolkit, and the GitHub runners have no GPU — the test binary dies with
      # "error while loading shared libraries: libcuda.so.1".
      - name: Run tests
        if: matrix.cuda != true
        run: cargo test ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      - name: Check formatting
        if: matrix.cuda != true
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} -- -D warnings -A clippy::collapsible_if -A clippy::collapsible_match
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '80' || '' }}

  # install.sh is what `curl | sh` users run, and it decides between the CPU
  # and the CUDA build. Lint it and run its tests (no network: they serve fake
  # release assets) on both systems it supports — `sh` is dash on Ubuntu and
  # bash in POSIX mode on macOS, and the two disagree often enough to matter.
  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Preinstalled on the Ubuntu image, absent from the macOS one.
      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: Lint install.sh
        run: shellcheck -s sh install.sh

      - name: Test install.sh
        run: sh tests/install_test.sh
