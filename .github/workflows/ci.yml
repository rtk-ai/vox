name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # CUDA matrix entries are best-effort: GH-hosted runners' kernel mismatch
    # currently breaks nvidia-dkms (Jimver/cuda-toolkit action). Mirror the
    # non-blocking behavior already applied in release.yml.
    continue-on-error: ${{ matrix.cuda == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Metal)
            os: macos-latest
            features: metal
            deps: ""
          - name: Linux (CPU)
            os: ubuntu-latest
            features: ""
            deps: libasound2-dev
          - name: Linux (CUDA)
            os: ubuntu-latest
            features: cuda
            deps: libasound2-dev
            cuda: true
          - name: Windows (CPU)
            os: windows-latest
            features: ""
            deps: ""
          - name: Windows (CUDA)
            os: windows-latest
            features: cuda
            cuda: true
            deps: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: matrix.deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      # Install only the components candle-kernels needs (nvcc + the libs cudarc
      # links). The full toolkit pulls cuda-demo-suite / cuda-runtime, whose
      # dpkg post-install scripts fail on the GitHub runner and take the whole
      # job down before a single line of Rust is compiled.
      - name: Install CUDA toolkit
        if: matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          # Linux is green on 12.6. Windows needs a newer CUDA: 12.6 rejects the
          # runner's Visual Studio 18 outright ("unsupported Microsoft Visual
          # Studio version" from crt/host_config.h). cudarc 0.17 supports up
          # to CUDA 13.0.
          cuda: ${{ runner.os == 'Windows' && '13.0.0' || '12.6.3' }}
          method: network
          # Component names differ by platform. On Linux these are apt packages
          # (cuda-nvcc-12-6, ...), and the linker needs the -dev variants for
          # the .so symlinks; cublas/curand have no cuda- prefix there, so they
          # go in non-cuda-sub-packages (libcublas-12-6, ...). On Windows the
          # NVIDIA installer takes plain component names and rejects both the
          # -dev suffixes and the lib* names.
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "nvrtc", "cublas", "curand"]' || '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]' }}
          non-cuda-sub-packages: ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]' }}

      # nvcc drives the host compiler, and on Windows that is cl.exe, which the
      # runner does not place on PATH. Without this, candle-kernels fails with
      # "nvcc fatal : Cannot find compiler 'cl.exe' in PATH".
      # nvcc drives the host compiler, and on Windows that is cl.exe, which the
      # runner does not place on PATH. Do not pin a toolset here: the image
      # ships Visual Studio 18, which carries no 14.3x toolset, and asking for
      # one fails with "Could not setup Developer Command Prompt".
      - name: Set up MSVC environment (Windows CUDA)
        if: runner.os == 'Windows' && matrix.cuda == true
        uses: ilammy/msvc-dev-cmd@v1

      # esaxx-rs forces /MT via .static_crt(true) but ort-sys prebuilt links
      # against /MD. Force /MD on Windows so cc's last flag wins and the
      # CRT matches ort-sys. Without this, link fails with LNK2038.
      - name: Set Windows MSVC runtime flags
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CFLAGS=/MD" >> $env:GITHUB_ENV
          echo "CXXFLAGS=/MD" >> $env:GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.features }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '89' || '' }}

      # The CUDA jobs verify that the GPU feature still compiles. They cannot
      # run the result: libcuda.so.1 ships with the NVIDIA driver, not the
      # toolkit, and the GitHub runners have no GPU — the test binary dies with
      # "error while loading shared libraries: libcuda.so.1".
      - name: Run tests
        if: matrix.cuda != true
        run: cargo test ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      - name: Check formatting
        if: matrix.cuda != true
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} -- -D warnings -A clippy::collapsible_if -A clippy::collapsible_match
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '89' || '' }}
