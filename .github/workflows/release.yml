name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}${{ matrix.cuda == true && ' (CUDA)' || '' }}
    runs-on: ${{ matrix.os }}
    # The CUDA build stays best-effort here: a release must still go out if
    # the CUDA toolkit download has a bad day. CI gates the regression.
    continue-on-error: ${{ matrix.cuda == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: metal
            archive: tar.gz
            artifact_suffix: ""
          # x86_64-apple-darwin removed: ort (via piper-rs) has no prebuilt
          # binaries for Intel Macs. Intel Macs are EOL.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: ""
            archive: tar.gz
            deps: libasound2-dev
            artifact_suffix: ""
            packages: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: ""
            archive: tar.gz
            deps: libasound2-dev
            artifact_suffix: ""
            packages: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: cuda
            archive: tar.gz
            deps: libasound2-dev
            cuda: true
            artifact_suffix: "-cuda"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: ""
            archive: zip
            artifact_suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.deps != ''
        # Third-party repos preinstalled on runner images (packages.microsoft.com)
        # intermittently break apt-get update with signature errors; we don't
        # need them, so drop them instead of failing the release.
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      # Install only the components candle-kernels needs (nvcc + the libs cudarc
      # links). The full toolkit pulls cuda-demo-suite / cuda-runtime, whose
      # dpkg post-install scripts fail on the GitHub runner and take the whole
      # job down before a single line of Rust is compiled.
      - name: Install CUDA toolkit
        if: matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.6.3'
          method: network
          # Only the components candle-kernels/cudarc actually link. The full
          # toolkit pulls cuda-demo-suite / cuda-runtime, whose dpkg
          # post-install fails on the runner. The linker needs the -dev
          # variants for the .so symlinks, and cublas/curand carry no cuda-
          # prefix, so they live in non-cuda-sub-packages.
          sub-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]'

      # nvcc drives the host compiler, and on Windows that is cl.exe, which the
      # runner does not place on PATH. Without this, candle-kernels fails with
      # "nvcc fatal : Cannot find compiler 'cl.exe' in PATH".
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
        # 8.0 (RTX 30 series) is the oldest generation the candle kernels
        # compile for: 7.0 fails on bfloat16 tensor-core fragments, 6.1 on
        # atomicAdd for half floats. A binary built for 8.0 runs on newer
        # cards (checked on an RTX 4070 Ti SUPER, 8.9); the previous value, 89,
        # shut out everything older than the RTX 40 series.
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '80' || '' }}

      # Evidence for the docs and for install.sh: which CUDA libraries the
      # binary asks the dynamic loader for. ldd only resolves the names, it
      # does not start vox — the runner has no GPU and no libcuda.so.1 (that
      # one ships with the NVIDIA driver, not the toolkit), so running the
      # binary here would fail. This step reports and never fails the job:
      # losing the CUDA asset over a report would be worse than no report.
      - name: Record CUDA runtime dependencies
        if: matrix.cuda == true
        continue-on-error: true
        run: |
          BIN="target/${{ matrix.target }}/release/vox"
          ASSET="vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.${{ matrix.archive }}"
          DEPS="$(ldd "$BIN" | grep -E 'libcuda|libcublas|libcurand|libnvrtc|libcudart' || true)"
          if [ -z "$DEPS" ]; then
            echo "::warning title=No CUDA libraries in ldd output::ldd lists no CUDA library for $BIN. Is $ASSET really a CUDA build?"
            echo "=== full ldd output ==="
            ldd "$BIN" || true
            DEPS="(none: ldd lists no CUDA library for this binary)"
          fi
          echo "=== CUDA libraries $ASSET needs at run time (ldd) ==="
          echo "$DEPS"
          {
            echo "### CUDA libraries \`$ASSET\` needs at run time"
            echo ""
            echo "\`ldd\` on the build runner, which has the CUDA toolkit but no NVIDIA driver. \"not found\" means the library is not on this runner's loader path, not that the build is broken. A machine that runs this binary needs every library listed here."
            echo ""
            echo '```'
            echo "$DEPS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.${{ matrix.archive }} vox
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.zip vox.exe
          cd ../../..

      - name: Package (deb + rpm)
        if: matrix.packages == true
        # Runners are native for both Linux targets, so arch inference from the
        # host is correct and we can use the default target/release layout.
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vox target/release/vox
          cargo deb --no-build --output vox-${{ matrix.target }}.deb
          cargo generate-rpm --output vox-${{ matrix.target }}.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: |
            vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.${{ matrix.archive }}
            vox-${{ matrix.target }}.deb
            vox-${{ matrix.target }}.rpm
          if-no-files-found: error

  release:
    name: Upload Release Assets
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;
          echo "=== Release assets ==="
          ls -lh release/

      # The CUDA build job is continue-on-error (a failing matrix entry once
      # blocked every asset of a release), so when it fails this job still
      # runs, green, with one asset missing. That is how releases went out
      # without a CUDA build and nobody was told. The release still goes out;
      # this step only makes the gap visible.
      - name: Report whether the release has a CUDA build
        run: |
          CUDA_ASSET="vox-x86_64-unknown-linux-gnu-cuda.tar.gz"
          if [ -f "release/$CUDA_ASSET" ]; then
            echo "CUDA build present: $CUDA_ASSET"
            echo "CUDA build included: \`$CUDA_ASSET\`." >> "$GITHUB_STEP_SUMMARY"
          else
            MSG="This release has no CUDA build: $CUDA_ASSET is missing because its build job failed (see the job \"Build x86_64-unknown-linux-gnu (CUDA)\" of this run). install.sh will fall back to the CPU build, including for VOX_GPU=cuda."
            echo "::warning title=Release has no CUDA build::$MSG"
            echo "**Warning:** $MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create checksums
        run: |
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Upload to existing release
        run: gh release upload "$TAG" release/* --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo rtk-ai/vox \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          {
            echo "arm=$(grep aarch64-apple-darwin checksums.txt | awk '{print $1}')"
            echo "linux=$(grep 'x86_64-unknown-linux-gnu.tar.gz' checksums.txt | awk '{print $1}')"
            echo "linuxarm=$(grep 'aarch64-unknown-linux-gnu.tar.gz' checksums.txt | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > vox.rb << 'FORMULA'
          class Vox < Formula
            desc "Local text-to-speech and speech-to-text for AI coding agents"
            homepage "https://github.com/rtk-ai/vox"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            # macOS: Apple Silicon only (the Metal build). There is no Intel Mac
            # build: the ONNX runtime used by the piper backend has no prebuilt
            # binary for x86_64-apple-darwin. The requirement below stops
            # `brew install` on an Intel Mac with "The arm64 architecture is
            # required for this software." The url is deliberately not wrapped
            # in on_arm: without a url the formula would not even load on an
            # Intel Mac, and the requirement could not speak.
            on_macos do
              url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_ARM_PLACEHOLDER"

              depends_on arch: :arm64
            end

            on_linux do
              on_intel do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_PLACEHOLDER"
              end
              on_arm do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM_PLACEHOLDER"
              end
            end

            def install
              bin.install "vox"
            end

            test do
              assert_match "vox #{version}", shell_output("#{bin}/vox --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" vox.rb
          sed -i "s/TAG_PLACEHOLDER/$TAG/g" vox.rb
          sed -i "s/SHA_ARM_PLACEHOLDER/${{ steps.sha.outputs.arm }}/g" vox.rb
          sed -i "s/SHA_LINUX_PLACEHOLDER/${{ steps.sha.outputs.linux }}/g" vox.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.linuxarm }}/g" vox.rb
          # Remove leading spaces from heredoc
          sed -i 's/^          //' vox.rb

      - name: Push to homebrew-tap
        run: |
          CONTENT=$(base64 -w 0 vox.rb)
          SHA=$(gh api repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb \
              -f message="vox ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb \
              -f message="vox ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
