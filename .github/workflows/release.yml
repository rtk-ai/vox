name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}${{ matrix.cuda == true && ' (CUDA)' || '' }}
    runs-on: ${{ matrix.os }}
    # CUDA matrix entries are best-effort: GH-hosted runners' kernel mismatch
    # currently breaks nvidia-dkms. Don't block the release on those.
    continue-on-error: ${{ matrix.cuda == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: metal
            archive: tar.gz
            artifact_suffix: ""
          # x86_64-apple-darwin removed: ort (via piper-rs) has no prebuilt
          # binaries for Intel Macs. Intel Macs are EOL.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: ""
            archive: tar.gz
            deps: libasound2-dev
            artifact_suffix: ""
            packages: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: ""
            archive: tar.gz
            deps: libasound2-dev
            artifact_suffix: ""
            packages: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: cuda
            archive: tar.gz
            deps: libasound2-dev
            cuda: true
            artifact_suffix: "-cuda"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: ""
            archive: zip
            artifact_suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: cuda
            archive: zip
            cuda: true
            artifact_suffix: "-cuda"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.deps != ''
        # Third-party repos preinstalled on runner images (packages.microsoft.com)
        # intermittently break apt-get update with signature errors; we don't
        # need them, so drop them instead of failing the release.
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      # Install only the components candle-kernels needs (nvcc + the libs cudarc
      # links). The full toolkit pulls cuda-demo-suite / cuda-runtime, whose
      # dpkg post-install scripts fail on the GitHub runner and take the whole
      # job down before a single line of Rust is compiled.
      - name: Install CUDA toolkit
        if: matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.6.3'
          method: network
          # Component names differ by platform. On Linux these are apt packages
          # (cuda-nvcc-12-6, ...), and the linker needs the -dev variants for
          # the .so symlinks; cublas/curand have no cuda- prefix there, so they
          # go in non-cuda-sub-packages (libcublas-12-6, ...). On Windows the
          # NVIDIA installer takes plain component names and rejects both the
          # -dev suffixes and the lib* names.
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "nvrtc", "cublas", "curand"]' || '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]' }}
          non-cuda-sub-packages: ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]' }}

      # nvcc drives the host compiler, and on Windows that is cl.exe, which the
      # runner does not place on PATH. Without this, candle-kernels fails with
      # "nvcc fatal : Cannot find compiler 'cl.exe' in PATH".
      # CUDA 12.6 refuses any MSVC newer than VS 2022 17.10 ("unsupported
      # Microsoft Visual Studio version" from crt/host_config.h), and the
      # runner image now ships a newer one. Pin a toolset nvcc accepts.
      - name: Set up MSVC environment (Windows CUDA)
        if: runner.os == 'Windows' && matrix.cuda == true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.39'

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda == true && '89' || '' }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.${{ matrix.archive }} vox
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.zip vox.exe
          cd ../../..

      - name: Package (deb + rpm)
        if: matrix.packages == true
        # Runners are native for both Linux targets, so arch inference from the
        # host is correct and we can use the default target/release layout.
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vox target/release/vox
          cargo deb --no-build --output vox-${{ matrix.target }}.deb
          cargo generate-rpm --output vox-${{ matrix.target }}.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: |
            vox-${{ matrix.target }}${{ matrix.artifact_suffix }}.${{ matrix.archive }}
            vox-${{ matrix.target }}.deb
            vox-${{ matrix.target }}.rpm
          if-no-files-found: error

  release:
    name: Upload Release Assets
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag found"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;
          echo "=== Release assets ==="
          ls -lh release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload to existing release
        run: gh release upload "$TAG" release/* --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo rtk-ai/vox \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "arm=$(grep aarch64-apple-darwin checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "intel=$(grep x86_64-apple-darwin checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux=$(grep 'x86_64-unknown-linux-gnu.tar.gz' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linuxarm=$(grep 'aarch64-unknown-linux-gnu.tar.gz' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > vox.rb << 'FORMULA'
          class Vox < Formula
            desc "Cross-platform TTS CLI — local voice synthesis with three backends"
            homepage "https://github.com/rtk-ai/vox"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              on_intel do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_INTEL_PLACEHOLDER"
              end
              on_arm do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_ARM_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_PLACEHOLDER"
              end
              on_arm do
                url "https://github.com/rtk-ai/vox/releases/download/TAG_PLACEHOLDER/vox-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM_PLACEHOLDER"
              end
            end

            def install
              bin.install "vox"
            end

            test do
              assert_match "vox #{version}", shell_output("#{bin}/vox --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" vox.rb
          sed -i "s/TAG_PLACEHOLDER/$TAG/g" vox.rb
          sed -i "s/SHA_INTEL_PLACEHOLDER/${{ steps.sha.outputs.intel }}/g" vox.rb
          sed -i "s/SHA_ARM_PLACEHOLDER/${{ steps.sha.outputs.arm }}/g" vox.rb
          sed -i "s/SHA_LINUX_PLACEHOLDER/${{ steps.sha.outputs.linux }}/g" vox.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.linuxarm }}/g" vox.rb
          # Remove leading spaces from heredoc
          sed -i 's/^          //' vox.rb

      - name: Push to homebrew-tap
        run: |
          CONTENT=$(base64 -w 0 vox.rb)
          SHA=$(gh api repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb \
              -f message="vox ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/vox.rb \
              -f message="vox ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
